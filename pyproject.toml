[project]
name = "airtruck"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.16.0",
    "numpy==2.2.6",
    "gymnasium==1.4.0",
    "lerobot[feetech,training]==0.6.1",
    "pygame-ce==2.5.8",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "onshape-to-robot==1.8.3",
    "trimesh==4.12.2",
    "coacd==1.0.9",
    "scipy==1.17.1",
    "basedpyright==1.40.2",
]

[tool.uv]
package = false

# Native ROS is distributed through RoboStack, rather than PyPI/uv.
[tool.airtruck.ros]
environment = "airtruck-ros"
distribution = "jazzy"
packages = [
    "python=3.12", "numpy=2.2.6", "ros-jazzy-rclpy=7.1.12",
    "ros-jazzy-rosidl-default-generators=1.6.1", "cmake=3.31.8",
    "ninja=1.13.2", "colcon-common-extensions=0.3.0",
]
px4_revision = "392e831c1f659429ca83902e66820d7094591410"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "-p", "no:cacheprovider",
    "--import-mode=importlib",
]

testpaths = ["airtruck"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
files = "."
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["lerobot.*"]
ignore_missing_imports = true
