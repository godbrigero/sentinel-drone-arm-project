[project]
name = "airtruck"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.16.0",
    "numpy==2.2.6",
    "gymnasium==1.4.0",
    "lerobot[feetech,training]==0.6.1",
    "pygame-ce==2.5.8",
    "opencv-python-headless==4.13.0.92",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "onshape-to-robot==1.8.3",
    "trimesh==4.12.2",
    "coacd==1.0.9",
    "scipy==1.17.1",
    "basedpyright==1.40.2",
    "paramiko==5.1.0",
    "types-paramiko==5.0.0.20261021",
]

[tool.uv]
package = false

# Native ROS is distributed through RoboStack, rather than PyPI/uv.
[tool.airtruck.ros]
environment = "airtruck-ros"
distribution = "humble"
# RoboStack Humble defaults to Cyclone DDS; the aircraft's PX4 bridge
# (MicroXRCEAgent) is Fast DDS.
rmw_implementation = "rmw_fastrtps_cpp"
packages = [
    "python=3.12", "numpy=2.2.6", "ros-humble-rclpy=3.3.21",
    "ros-humble-rmw-fastrtps-cpp=6.2.10", "ros-humble-geometry-msgs=4.9.1",
    "ros-humble-rosidl-default-generators=1.2.1", "cmake=3.31.8",
    "ninja=1.13.2", "colcon-common-extensions=0.3.0",
]
px4_revision = "6954ed341da55e5b514780d6301dd2e4647c2e49"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "-p", "no:cacheprovider",
    "--import-mode=importlib",
]

testpaths = ["airtruck"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
files = "."
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["lerobot.*"]
ignore_missing_imports = true
